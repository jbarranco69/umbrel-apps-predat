version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: predat-dolibarr_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  db:
    image: mariadb:11.4
    restart: on-failure
    environment:
      MARIADB_ROOT_PASSWORD: ${APP_PASSWORD}
      MARIADB_DATABASE: dolibarr
      MARIADB_USER: dolibarr
      MARIADB_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/mysql

  web:
    image: dolibarr/dolibarr:24.0.3
    restart: on-failure
    depends_on:
      - db
    environment:
      DOLI_DB_HOST: predat-dolibarr_db_1
      DOLI_DB_NAME: dolibarr
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: ${APP_PASSWORD}
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: ${APP_PASSWORD}
      DOLI_URL_ROOT: http://umbrel.local:8095
      PHP_INI_DATE_TIMEZONE: Europe/Madrid
    volumes:
      - ${APP_DATA_DIR}/data/documents:/var/www/documents
      - ${APP_DATA_DIR}/data/custom:/var/www/html/custom
